[project]
name = "mlis"
version = "0.1.0"
description = "Multi-model intelligent surveillance: person search and description (DINOv3 + Q-Former + Qwen3)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "torch>=2.4",
    "transformers>=4.57",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "slow: tests that take more than a few seconds",
    "network: tests that download from the Hugging Face Hub (never run in CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mlis"]
